apiVersion: suse.ai/v1alpha1
kind: Stack
metadata:
  name: kubeflow
spec:
  category: ML Platform
  description: End-to-end ML platform with pipelines, notebooks, and training.
  displayName: Kubeflow
  modules:
    - moduleRef: cert-manager
    - dependsOn:
        - cert-manager
      moduleRef: istio-system
    - dependsOn:
        - istio-system
      moduleRef: istiod
    - dependsOn:
        - istiod
      moduleRef: istio-gateway
    - dependsOn:
        - istio-gateway
      moduleRef: kubeflow-namespace
    - dependsOn:
        - kubeflow-namespace
      moduleRef: kubeflow-crds
    - dependsOn:
        - kubeflow-crds
      moduleRef: kubeflow-base
    - dependsOn:
        - kubeflow-base
      moduleRef: kubeflow-admission-webhook
    - dependsOn:
        - kubeflow-admission-webhook
      moduleRef: kubeflow-knative-crds
    - dependsOn:
        - kubeflow-knative-crds
      moduleRef: kubeflow-knative
    - dependsOn:
        - kubeflow-base
      moduleRef: kubeflow-dex
    - dependsOn:
        - kubeflow-dex
      moduleRef: kubeflow-oauth2-proxy
    - dependsOn:
        - kubeflow-oauth2-proxy
      moduleRef: kubeflow-central-dashboard
    - dependsOn:
        - kubeflow-central-dashboard
      moduleRef: kubeflow-profiles
    - dependsOn:
        - kubeflow-profiles
      moduleRef: kubeflow-user-namespace
    - dependsOn:
        - kubeflow-central-dashboard
      moduleRef: kubeflow-notebooks
    - dependsOn:
        - kubeflow-central-dashboard
      moduleRef: kubeflow-tensorboards
    - dependsOn:
        - kubeflow-central-dashboard
      moduleRef: kubeflow-pipelines
    - dependsOn:
        - kubeflow-pipelines
      moduleRef: kubeflow-katib
    - dependsOn:
        - kubeflow-pipelines
      moduleRef: kubeflow-training-operator
    - dependsOn:
        - kubeflow-pipelines
      moduleRef: kubeflow-spark-operator
    - dependsOn:
        - kubeflow-knative
        - kubeflow-training-operator
      moduleRef: kubeflow-serving
    - dependsOn:
        - kubeflow-central-dashboard
      moduleRef: kubeflow-prometheus-stack
  source:
    git:
      ref: master
      url: https://github.com/stevenbecht/kubeflow-fleet
      path: stack.yaml
---
